name: VibeLedger

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  VibeLedger:
    type: application
    platform: iOS
    sources:
      - path: VibeLedger
    resources:
      - path: VibeLedger/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vibeledger
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    info:
      path: VibeLedger/Info.plist
      properties:
        CFBundleDisplayName: VibeLedger
        UILaunchScreen: {}

  VibeLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VibeLedgerTests
    dependencies:
      - target: VibeLedger
